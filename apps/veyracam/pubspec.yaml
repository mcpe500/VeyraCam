name: veyracam
description: VeyraCam - Transform your Android smartphone into a high-performance PC virtual webcam.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter
  meta: ^1.11.0
  veyra_models:
    path: ../../packages/veyra_models
  veyra_protocol_dart:
    path: ../../packages/veyra_protocol_dart
  veyra_ui:
    path: ../../packages/veyra_ui

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
