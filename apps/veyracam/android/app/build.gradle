plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

// H-2: release signing keys come from CI secrets (never checked into git).
def ksBase64 = System.getenv("ANDROID_KEYSTORE_BASE64")
def ksStorePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")
def ksKeyAlias = System.getenv("ANDROID_KEY_ALIAS")
def ksKeyPassword = System.getenv("ANDROID_KEY_PASSWORD")

def releaseKeystoreFile = file("${rootProject.projectDir}/release-keystore.jks")
if (ksBase64) {
    releaseKeystoreFile.bytes = ksBase64.decodeBase64()
}

android {
    namespace "com.veyra.cam"
    compileSdk 34
    ndkVersion "28.2.13676358"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    signingConfigs {
        release {
            if (ksBase64 && releaseKeystoreFile.exists()) {
                storeFile releaseKeystoreFile
                storePassword ksStorePassword
                keyAlias ksKeyAlias
                keyPassword ksKeyPassword
            }
        }
    }

    defaultConfig {
        applicationId "com.veyra.cam"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "1.0.1"

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++20"
                arguments "-DANDROID_STL=c++_shared"
            }
        }
        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a", "x86_64"
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    buildTypes {
        release {
            signingConfig ksBase64 ? signingConfigs.release : signingConfigs.debug
            minifyEnabled false
            shrinkResources false
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.22'
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
}
