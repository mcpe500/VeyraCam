name: Veyra Release Matrix (Android APK & Windows EXE)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK (VeyraCam)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android NDK & SDK
        uses: nttld/setup-ndk@aacaf74664d0f8e1b070a865acb47ee25007386d # v1.6.0
        with:
          ndk-version: r28.2.13676358

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: |
          cd packages/veyra_models && flutter pub get
          cd ../veyra_protocol_dart && flutter pub get
          cd ../veyra_ui && flutter pub get
          cd ../../apps/veyracam && flutter pub get

      - name: Build Release APK (signed)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd apps/veyracam
          flutter build apk --release --android-skip-build-dependency-validation

      - name: Locate & Rename APK
        run: |
          tag_name="${GITHUB_REF_NAME#v}"
          find apps/veyracam -name "*.apk" -exec cp {} "VeyraCam-${tag_name}.apk" \;
          ls -lh VeyraCam-*.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: veyracam-apk
          path: VeyraCam-*.apk

  build-windows:
    name: Build Windows Desktop (VeyraLink & VeyraCore)
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up MSVC & CMake
        uses: ilammy/msvc-dev-cmd@a102174a2b586eec2ea151a69e6fd14404a8ce7c # v1.13.0

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Build Native C++ VeyraCore & DLL
        run: |
          cd native/windows
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release

      - name: Build Flutter Desktop UI
        run: |
          cd packages/veyra_models && flutter pub get
          cd ../veyra_protocol_dart && flutter pub get
          cd ../veyra_native && flutter pub get
          cd ../veyra_ui && flutter pub get
          cd ../../apps/veyralink && flutter pub get
          flutter build windows --release

      - name: Bundle Desktop Release Package
        shell: pwsh
        run: |
          $tagName = $env:GITHUB_REF_NAME.TrimStart('v')
          $releaseDir = "apps/veyralink/build/windows/x64/runner/Release"
          Copy-Item "native/windows/build/Release/VeyraCore.exe" -Destination $releaseDir
          Copy-Item "native/windows/build/Release/veyra_core_api.dll" -Destination $releaseDir
          Compress-Archive -Path "$releaseDir/*" -DestinationPath "VeyraLink-$tagName-windows-x64.zip"

      - name: Upload Windows Bundle Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: veyralink-windows
          path: VeyraLink-*-windows-x64.zip

  publish-release:
    name: Publish GitHub Release
    needs: [build-android, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Download Android APK
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: veyracam-apk

      - name: Download Windows Bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: veyralink-windows

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: |
            VeyraCam-*.apk
            VeyraLink-*.zip
          name: "Veyra System ${{ github.ref_name }} (Release)"
          body: |
            ## VeyraCam ${{ github.ref_name }} — Zero-Copy Virtual Webcam

            ### 📦 Included Release Binaries:
            1. **`VeyraCam-${{ github.ref_name }}.apk`** — Android 7.0+ Application (Camera2 HW encoder, Screen-Off mode, foreground service).
            2. **`VeyraLink-${{ github.ref_name }}-windows-x64.zip`** — Windows 10/11 Suite (Includes `VeyraLink.exe`, `VeyraCore.exe`, and `veyra_core_api.dll` virtual camera drivers).

            ### 🔒 Security hardening (v1.0.1):
            - End-to-end encryption for media (X25519 + ChaCha20-Poly1305 via mbedTLS).
            - PIN-based pairing with per-session tokens and replay protection.
            - Removed cleartext traffic flag, hardened CI, pinned action hashes.
          draft: false
          prerelease: false